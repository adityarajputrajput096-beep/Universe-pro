<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universe Pro</title>

  const firebaseConfig = {
    apiKey: "AIzaSyBSCxAOI0DGmGBc3V2emwJUECZfxt7fMoA",
    authDomain: "universe-pro-f36a8.firebaseapp.com",
    databaseURL: "https://universe-pro-f36a8-default-rtdb.firebaseio.com",
    projectId: "universe-pro-f36a8",
    storageBucket: "universe-pro-f36a8.firebasestorage.app",
    messagingSenderId: "1051673611050",
    appId: "1:1051673611050:web:24d6db4c72628131d42c53",
    measurementId: "G-0LNVPWTMCF"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  window.firebaseApp = app;

<style>
:root{
  --bg:#000000;
  --card:#121212;
  --card-border:#262626;
  --accent:#0095f6;
  --like:#ff3040;
  --text:#ffffff;
  --muted:#a8a8a8;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;transition:transform 0.1s ease, opacity 0.2s ease}
button:active{transform:scale(0.96)}
.hidden{display:none!important}

#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#000}
.auth-card{width:min(380px,100%);background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:36px 28px;box-shadow:0 15px 50px rgba(0,0,0,0.8)}
.logo{font-size:38px;font-weight:800;text-align:center;margin-bottom:28px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888,#5851db);-webkit-background-clip:text;color:transparent}
.input{width:100%;padding:12px;margin:6px 0;background:#1e1e1e;color:#fff;border:1px solid #333;border-radius:8px;outline:none;transition:border-color 0.2s}
.input:focus{border-color:var(--accent)}
.primary{width:100%;border:0;background:var(--accent);color:white;padding:11px;border-radius:8px;font-weight:700;margin-top:8px}
.switch{text-align:center;color:var(--muted);margin-top:18px;font-size:14px}.switch span{color:var(--accent);font-weight:700;cursor:pointer}
.note{font-size:11px;color:#666;text-align:center;margin-top:16px;line-height:1.4}

#app{display:none;min-height:100vh;padding-top:56px;padding-bottom:65px}
.header{height:56px;position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.header .brand{font-size:24px;font-weight:800;background:linear-gradient(45deg,#fff,#ccc);-webkit-background-clip:text;color:transparent}
.header-icons{display:flex;gap:18px;font-size:22px}
.icon-btn{background:none;border:0;color:#fff;font-size:22px}

main{width:min(650px,100%);margin:auto}
.tab{display:none}.tab.active{display:block}

/* Stories Bar */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px;border-bottom:1px solid var(--card-border);scrollbar-width:none;background:#050505}
.stories::-webkit-scrollbar{display:none}
.story{text-align:center;min-width:68px;font-size:11px;cursor:pointer}
.ring{width:64px;height:64px;padding:2px;border-radius:50%;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);margin:auto}
.ring.add-story-ring{background:#222;border:2px dashed var(--accent)}
.avatar{width:100%;height:100%;border-radius:50%;background:#252525;border:2px solid #000;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold}

/* Post Cards */
.post{border-bottom:1px solid var(--card-border);margin-bottom:15px;background:var(--bg)}
.post-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.person{display:flex;gap:10px;align-items:center;cursor:pointer}
.small-avatar{width:36px;height:36px;border-radius:50%;background:#333;background-size:cover;background-position:center;border:1px solid #444}
.post-media{width:100%;max-height:650px;background:#050505;display:flex;justify-content:center;align-items:center;cursor:pointer;position:relative;overflow:hidden;border-radius:4px}
.post-media img,.post-media video{width:100%;max-height:650px;object-fit:contain}

/* Heart Pop Animation */
.heart-pop{position:absolute;font-size:80px;color:var(--like);pointer-events:none;animation:pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;opacity:0}
@keyframes pop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}

.actions{display:flex;justify-content:space-between;padding:10px 14px;font-size:23px}
.actions-left{display:flex;gap:17px}
.action{border:0;background:none;color:#fff;font-size:22px;cursor:pointer}
.liked{color:var(--like)}
.details{padding:0 14px 14px;font-size:14px}
.likes{font-weight:700;margin-bottom:6px}
.caption b{margin-right:6px}
.comment-link{color:var(--muted);font-size:13px;margin-top:6px;cursor:pointer}

/* Search Tab */
.search-box{padding:13px;border-bottom:1px solid var(--card-border)}
.search-box input{width:100%;padding:12px;border:0;border-radius:10px;background:#1e1e1e;color:#fff;outline:none}
.search-result{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #1a1a1a;cursor:pointer}
.search-result:hover{background:#121212}

/* Profile Tab */
.profile{padding-bottom:20px}
.profile-top{display:flex;gap:24px;align-items:center;padding:25px 18px;border-bottom:1px solid var(--card-border)}
.profile-avatar{width:88px;height:88px;border-radius:50%;background:#222;background-size:cover;background-position:center;border:2px solid #444}
.stats{display:flex;gap:22px;text-align:center}
.stat strong{display:block;font-size:18px}
.bio{padding:15px 18px}
.profile-nav{display:flex;border-top:1px solid var(--card-border);border-bottom:1px solid var(--card-border)}
.profile-nav-btn{flex:1;padding:12px;background:none;border:0;color:var(--muted);font-weight:700;font-size:13px}
.profile-nav-btn.active{color:#fff;border-bottom:2px solid #fff}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid-item{aspect-ratio:1;background:#111;overflow:hidden;cursor:pointer;position:relative}
.grid-item img,.grid-item video{width:100%;height:100%;object-fit:cover}

.profile-actions{display:flex;gap:8px;padding:0 18px 15px}
.secondary{flex:1;background:#262626;color:#fff;border:1px solid #444;padding:9px;border-radius:8px;font-weight:700}
.secondary.following-btn{background:#1a1a1a;color:#888;border-color:#333}

.user-profile{padding-bottom:30px}
.user-head{display:flex;gap:20px;padding:24px 18px;align-items:center}
.user-actions{display:flex;gap:8px;padding:0 18px 20px}
.user-actions button{flex:1}
.section-title{font-weight:700;padding:15px 18px;border-top:1px solid var(--card-border)}

/* Reels */
.reels{height:calc(100vh - 121px);overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
.reel{height:calc(100vh - 121px);scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#050505}
.reel video{width:100%;height:100%;object-fit:contain}
.reel-info{position:absolute;left:16px;bottom:24px;text-shadow:0 2px 5px #000}
.reel-actions{position:absolute;right:14px;bottom:25px;display:flex;flex-direction:column;gap:18px;font-size:25px}

/* Chat */
.chat-list{padding:8px}
.chat-row{display:flex;gap:12px;padding:14px;border-bottom:1px solid #1c1c1c;align-items:center;cursor:pointer}
.chat-room{height:calc(100vh - 121px);display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:9px}
.bubble{max-width:75%;padding:10px 14px;border-radius:18px;background:#262626;font-size:14px;line-height:1.4}
.sent{align-self:flex-end;background:var(--accent);color:#fff}
.received{align-self:flex-start;background:#262626}
.chat-input{display:flex;padding:10px;gap:8px;border-top:1px solid var(--card-border);background:#000}
.chat-input input{flex:1;background:#1e1e1e;border:0;border-radius:20px;color:#fff;padding:11px 16px;outline:none}
.chat-input button{border:0;background:var(--accent);color:#fff;border-radius:20px;padding:0 18px;font-weight:700}

/* Upload */
.upload{padding:16px}
.preview{height:380px;background:#080808;border:1px dashed #444;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img,.preview video{max-width:100%;max-height:100%}
.toolbar{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;background:#262626;border:1px solid #444;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px}

/* Bottom Nav */
.bottom{position:fixed;bottom:0;left:0;right:0;height:56px;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);border-top:1px solid var(--card-border);display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom button{background:none;border:0;color:var(--muted);font-size:22px}
.bottom button.active-nav{color:#fff;transform:scale(1.1)}

/* Modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:15px}
.modal-card{background:#181818;border:1px solid #333;border-radius:14px;width:min(440px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.9)}
.modal-head{padding:15px;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.modal-body{padding:15px;overflow-y:auto;flex:1}

.comment-item{display:flex;gap:10px;margin-bottom:12px;font-size:13px}
.comment-item b{color:#fff;margin-right:5px}

.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;display:none;z-index:1000;font-size:13px;font-weight:600;box-shadow:0 5px 20px rgba(0,0,0,0.5)}

@media(max-width:500px){main{width:100%}.profile-top{gap:15px}.stats{gap:12px}.preview{height:310px}}
</style>
</head>
<body>

<section id="auth">
  <div class="auth-card">
    <div class="logo">Universe Pro</div>
    <form id="authForm">
      <input id="fullName" class="input hidden" placeholder="Full name">
      <input id="username" class="input" placeholder="Username" autocomplete="username" required>
      <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="primary" id="authBtn">Log In</button>
    </form>
    <div class="switch"><span id="switchText">Don't have an account?</span> <span id="switchBtn">Sign up</span></div>
    <div class="note">Demo app: accounts are stored only in this browser.</div>
  </div>
</section>

<div id="app">
<header class="header">
  <div class="brand">Universe Pro</div>
  <div class="header-icons">
    <button class="icon-btn" onclick="openChatList()">💬</button>
    <button class="icon-btn" onclick="openUpload()">➕</button>
  </div>
</header>

<main>
<section id="home" class="tab active">
  <div class="stories" id="stories"></div>
  <div id="feed"></div>
</section>

<section id="search" class="tab">
  <div class="search-box"><input id="searchInput" placeholder="Search people..." oninput="searchUsers(this.value)"></div>
  <div id="searchResults"></div>
</section>

<section id="reels" class="tab">
  <div class="reels" id="reelsList"></div>
</section>

<section id="upload" class="tab">
  <div class="upload">
    <h3 id="uploadTitle">Create Post</h3>
    <input id="fileInput" type="file" accept="image/*,video/*" style="margin:14px 0">
    <div class="preview" id="preview">Select a photo or video</div>
    <div class="toolbar">
      <button class="chip" onclick="filterPreview('brightness')">💡 Brightness</button>
      <button class="chip" onclick="filterPreview('contrast')">🌓 Contrast</button>
      <button class="chip" onclick="filterPreview('grayscale')">🎞️ B&W</button>
      <button class="chip" onclick="filterPreview('sepia')">📜 Vintage</button>
      <button class="chip" onclick="resetPreview()">🔄 Reset</button>
    </div>
    <input id="caption" class="input" placeholder="Write a caption...">
    <button class="primary" onclick="publish()">Publish Post</button>
  </div>
</section>

<section id="chat" class="tab">
  <div id="chatListView"><div class="section-title">Messages</div><div class="chat-list" id="chatList"></div></div>
  <div id="chatRoom" class="chat-room hidden">
    <div class="section-title"><button class="action" onclick="backChats()">←</button> <span id="chatTitle"></span></div>
    <div class="messages" id="messages"></div>
    <div class="chat-input"><input id="messageInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">Send</button></div>
  </div>
</section>

<section id="profile" class="tab">
  <div class="profile">
    <div class="profile-top">
      <div id="myAvatar" class="profile-avatar"></div>
      <div class="stats">
        <div class="stat"><strong id="postCount">0</strong>posts</div>
        <div class="stat"><strong id="followerCount">0</strong>followers</div>
        <div class="stat"><strong id="followingCount">0</strong>following</div>
      </div>
    </div>
    <div class="bio"><b id="myName"></b><p style="color:#aaa;margin-top:5px">Welcome to my Universe Pro 🚀</p></div>
    <div class="profile-actions">
      <button class="secondary" onclick="changeProfilePic()">Change photo</button>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>
    <input id="profileInput" type="file" accept="image/*" class="hidden" onchange="saveProfilePic(event)">
    <div class="profile-nav">
      <button class="profile-nav-btn active" id="btnMyPosts" onclick="switchProfileTab('posts')">📷 POSTS</button>
      <button class="profile-nav-btn" id="btnSavedPosts" onclick="switchProfileTab('saved')">🔖 SAVED</button>
    </div>
    <div class="grid" id="myGrid"></div>
  </div>
</section>

<section id="personProfile" class="tab">
  <div class="user-profile">
    <div class="user-head">
      <div id="personAvatar" class="profile-avatar"></div>
      <div>
        <h2 id="personName"></h2>
        <div style="color:#aaa;margin-top:5px" id="personUsername"></div>
        <div style="display:flex;gap:15px;margin-top:10px;font-size:13px">
          <span><b id="personFollowerCount">0</b> followers</span>
          <span><b id="personFollowingCount">0</b> following</span>
        </div>
      </div>
    </div>
    <div class="user-actions">
      <button id="personFollowBtn" class="primary" onclick="toggleFollowPerson()">Follow</button>
      <button class="secondary" onclick="startProfileChat()">💬 Chat</button>
    </div>
    <div class="section-title" id="personPhotoTitle">Photos</div>
    <div class="grid" id="personGrid"></div>
  </div>
</section>
</main>

<nav class="bottom">
  <button id="nav-home" class="active-nav" onclick="showTab('home')">🏠</button>
  <button id="nav-search" onclick="showTab('search')">🔍</button>
  <button id="nav-upload" onclick="openUpload()">➕</button>
  <button id="nav-reels" onclick="showTab('reels')">🎬</button>
  <button id="nav-profile" onclick="showTab('profile')">👤</button>
</nav>
</div>

<div id="toast" class="toast"></div>

<!-- Story Modal -->
<div id="storyModal" class="modal hidden" onclick="closeStory()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span id="storyUser"></span>
      <button class="action" onclick="closeStory()">✕</button>
    </div>
    <div class="modal-body" id="storyBody"></div>
  </div>
</div>

<input id="storyFileInput" type="file" accept="image/*" class="hidden" onchange="handleStoryUpload(event)">

<!-- Comments Modal -->
<div id="commentModal" class="modal hidden" onclick="closeComments()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span>Comments</span>
      <button class="action" onclick="closeComments()">✕</button>
    </div>
    <div class="modal-body" id="commentsList"></div>
    <div class="chat-input" style="border-top:1px solid #333;">
      <input id="commentInput" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')submitComment()">
      <button onclick="submitComment()">Post</button>
    </div>
  </div>
</div>

<!-- 1-Click Photo Viewer Modal (Lightbox) -->
<div id="postModal" class="modal hidden" onclick="closePostModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div id="postModalUser" class="person" onclick="openUserFromModal()"></div>
      <button class="action" onclick="closePostModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:0">
      <div id="postModalMedia" class="post-media" style="max-height:70vh;"></div>
      <div class="details" style="padding:15px">
        <div id="postModalLikes" class="likes"></div>
        <div id="postModalCaption" class="caption"></div>
        <div style="margin-top:12px;border-top:1px solid #282828;padding-top:10px;">
          <b>Comments:</b>
          <div id="postModalComments" style="margin-top:8px;max-height:120px;overflow-y:auto"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const KEY='universe_pro_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],posts:[],stories:[],chats:{}};
let current=null, signup=false, selected=null, previewUrl='', previewType='', previewFilter='', activeChat=null, profileUser=null;
let activeCommentPostId=null;
let profileTab='posts';
let activeModalPostId=null;
let lastClickTime=0;

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function userById(id){return db.users.find(u=>u.id===id)}
function me(){return userById(current)}

function showTab(id){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  
  document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active-nav'));
  let navBtn = document.getElementById('nav-'+id);
  if(navBtn) navBtn.classList.add('active-nav');

  if(id==='home')renderFeed();
  if(id==='reels')renderReels();
  if(id==='profile')renderProfile();
  if(id==='chat')renderChats();
}

function loginScreen(){document.getElementById('auth').style.display='flex';document.getElementById('app').style.display='none'}
function appScreen(){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';renderAll()}

document.getElementById('switchBtn').onclick=()=>{
  signup=!signup;
  document.getElementById('fullName').classList.toggle('hidden',!signup);
  document.getElementById('fullName').required=signup;
  document.getElementById('authBtn').textContent=signup?'Sign Up':'Log In';
  document.getElementById('switchText').textContent=signup?'Already have an account?':"Don't have an account?";
  document.getElementById('switchBtn').textContent=signup?'Log in':'Sign up';
}

document.getElementById('authForm').onsubmit=e=>{
  e.preventDefault();
  let u=document.getElementById('username').value.trim().toLowerCase(),
      p=document.getElementById('password').value,
      n=document.getElementById('fullName').value.trim();
  
  if(signup){
    if(!n)return toast('Enter your name');
    if(db.users.some(x=>x.username===u))return toast('Username already exists');
    let obj={id:crypto.randomUUID(),name:n,username:u,password:p,pic:'',following:[],created:Date.now()};
    db.users.push(obj);
    save();
    current=obj.id;
    localStorage.setItem('universe_session',current);
    appScreen();
    toast('Account created');
  }else{
    let obj=db.users.find(x=>x.username===u&&x.password===p);
    if(!obj)return toast('Wrong username or password');
    current=obj.id;
    localStorage.setItem('universe_session',current);
    appScreen();
    toast('Logged in');
  }
}

function logout(){localStorage.removeItem('universe_session');current=null;loginScreen()}
function renderAll(){renderStories();renderFeed();renderReels();renderProfile();renderChats()}
function avatarStyle(pic){return pic?`style="background-image:url('${pic}')"`:''}

function renderStories(){
  let s=document.getElementById('stories');
  let myObj=me();
  let addStoryBtn = `<div class="story" onclick="document.getElementById('storyFileInput').click()">
    <div class="ring add-story-ring"><div class="avatar" ${avatarStyle(myObj?.pic)}>+</div></div>
    <div>Your Story</div>
  </div>`;

  let userStories = db.users.map(u=>{
    let hasStory = db.stories.some(st=>st.userId===u.id);
    return `<div class="story" onclick="openUserStory('${u.id}')">
      <div class="ring" style="${hasStory?'':'background:#333'}">
        <div class="avatar" ${avatarStyle(u.pic)}></div>
      </div>
      <div>${esc(u.username)}</div>
    </div>`;
  }).join('');

  s.innerHTML = addStoryBtn + userStories;
}

function openUserStory(id){
  let st = db.stories.find(s=>s.userId===id);
  if(!st) return toast('No story available');
  let u = userById(id);
  document.getElementById('storyUser').textContent = u ? u.username : 'User';
  document.getElementById('storyBody').innerHTML = `<img src="${st.data}" style="width:100%;max-height:70vh;object-fit:contain">`;
  document.getElementById('storyModal').classList.remove('hidden');
}

function closeStory(){
  document.getElementById('storyModal').classList.add('hidden');
}

function handleStoryUpload(e){
  let f=e.target.files[0];
  if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    db.stories=db.stories.filter(s=>s.userId!==current);
    db.stories.push({id:crypto.randomUUID(),userId:current,data:r.result,time:Date.now()});
    save();
    renderStories();
    toast('Story updated!');
  };
  r.readAsDataURL(f);
}

function renderFeed(){
  let f=document.getElementById('feed');
  let posts=[...db.posts].sort((a,b)=>b.time-a.time);
  f.innerHTML=posts.map(post=>{
    let u=userById(post.userId);
    if(!u)return '';
    let liked=(post.likes||[]).includes(current);
    let isSaved=(post.saved||[]).includes(current);
    let commentsCount = (post.comments||[]).length;

    return `<article class="post">
      <div class="post-head">
        <div class="person" onclick="openUser('${u.id}')">
          <div class="small-avatar" ${avatarStyle(u.pic)}></div>
          <b>${esc(u.username)}</b>
        </div>
        ${post.userId===current ? `<button class="action" onclick="deletePost('${post.id}')">⋯</button>` : ''}
      </div>
      <div class="post-media" id="media-${post.id}" onclick="handleMediaClick(event, '${post.id}')">
        ${post.type==='video'?`<video src="${post.data}" controls></video>`:`<img src="${post.data}" alt="post">`}
      </div>
      <div class="actions">
        <div class="actions-left">
          <button class="action ${liked?'liked':''}" onclick="likePost('${post.id}')">${liked?'♥':'♡'}</button>
          <button class="action" onclick="openComments('${post.id}')">💬</button>
          <button class="action" onclick="sharePost('${post.id}')">➤</button>
        </div>
        <button class="action" onclick="savePost('${post.id}')">${isSaved?'🔖':'📑'}</button>
      </div>
      <div class="details">
        <div class="likes">${post.likes?.length||0} likes</div>
        <div class="caption"><b>${esc(u.username)}</b>${esc(post.caption||'')}</div>
        <div class="comment-link" onclick="openComments('${post.id}')">
          ${commentsCount>0?`View all ${commentsCount} comments`:'Add a comment...'}
        </div>
      </div>
    </article>`;
  }).join('')||'<div style="padding:40px;text-align:center;color:#777">No posts yet. Create the first one!</div>';
}

/* 1-Click & Double Tap Handler */
function handleMediaClick(event, postId){
  let now = Date.now();
  if (now - lastClickTime < 300) {
    triggerHeartPop(postId);
    likePost(postId, true);
  } else {
    setTimeout(()=>{
      if (Date.now() - lastClickTime >= 300) {
        openPostModal(postId);
      }
    }, 300);
  }
  lastClickTime = now;
}

function triggerHeartPop(postId){
  let el = document.getElementById('media-' + postId);
  if(!el) return;
  let heart = document.createElement('div');
  heart.className = 'heart-pop';
  heart.innerHTML = '♥';
  el.appendChild(heart);
  setTimeout(()=> heart.remove(), 600);
}

/* Open Full Photo Modal */
function openPostModal(postId){
  activeModalPostId = postId;
  let p = db.posts.find(x => x.id === postId);
  if(!p) return;
  let u = userById(p.userId);

  document.getElementById('postModalUser').innerHTML = `
    <div class="small-avatar" ${avatarStyle(u?.pic)}></div>
    <b>${esc(u?.username || 'user')}</b>
  `;
  document.getElementById('postModalMedia').innerHTML = p.type === 'video' ? `<video src="${p.data}" controls></video>` : `<img src="${p.data}">`;
  document.getElementById('postModalLikes').textContent = (p.likes?.length || 0) + ' likes';
  document.getElementById('postModalCaption').innerHTML = `<b>${esc(u?.username)}</b> ${esc(p.caption || '')}`;

  let commentsHtml = (p.comments || []).map(c => {
    let cu = userById(c.userId);
    return `<div class="comment-item"><b>${esc(cu?.username || 'user')}:</b> ${esc(c.text)}</div>`;
  }).join('') || '<div style="color:#777">No comments yet.</div>';

  document.getElementById('postModalComments').innerHTML = commentsHtml;
  document.getElementById('postModal').classList.remove('hidden');
}

function closePostModal(){
  document.getElementById('postModal').classList.add('hidden');
  activeModalPostId = null;
}

function openUserFromModal(){
  if(!activeModalPostId) return;
  let p = db.posts.find(x => x.id === activeModalPostId);
  closePostModal();
  if(p) openUser(p.userId);
}

function openComments(postId){
  activeCommentPostId=postId;
  renderCommentsList();
  document.getElementById('commentModal').classList.remove('hidden');
}

function closeComments(){
  document.getElementById('commentModal').classList.add('hidden');
  activeCommentPostId=null;
}

function renderCommentsList(){
  let p=db.posts.find(x=>x.id===activeCommentPostId);
  if(!p)return;
  p.comments = p.comments || [];
  let box=document.getElementById('commentsList');
  box.innerHTML = p.comments.map(c=>{
    let u=userById(c.userId);
    return `<div class="comment-item">
      <div class="small-avatar" style="width:26px;height:26px;${u?.pic?`background-image:url('${u.pic}')`:''}"></div>
      <div><b>${esc(u?.username||'user')}:</b> ${esc(c.text)}</div>
    </div>`;
  }).join('')||'<p style="color:#777;text-align:center">No comments yet.</p>';
}

function submitComment(){
  let input=document.getElementById('commentInput');
  let txt=input.value.trim();
  if(!txt || !activeCommentPostId)return;
  let p=db.posts.find(x=>x.id===activeCommentPostId);
  p.comments = p.comments || [];
  p.comments.push({id:crypto.randomUUID(),userId:current,text:txt,time:Date.now()});
  input.value='';
  save();
  renderCommentsList();
  renderFeed();
}

function likePost(id, forceLike = false){
  let p=db.posts.find(x=>x.id===id);
  p.likes=p.likes||[];
  let i=p.likes.indexOf(current);
  if (forceLike) {
    if (i < 0) p.likes.push(current);
  } else {
    i>=0?p.likes.splice(i,1):p.likes.push(current);
  }
  save();
  renderFeed();
  renderProfile();
  if(activeModalPostId === id) openPostModal(id);
}

function savePost(id){
  let p=db.posts.find(x=>x.id===id);
  p.saved=p.saved||[];
  let i=p.saved.indexOf(current);
  i>=0?p.saved.splice(i,1):p.saved.push(current);
  save();
  renderFeed();
  renderProfile();
  toast(i>=0?'Removed from saved':'Saved');
}

function sharePost(id){
  navigator.clipboard?.writeText(location.href).then(()=>toast('Link copied')).catch(()=>toast('Share link ready'));
}

function deletePost(id){
  let p=db.posts.find(x=>x.id===id);
  if(p?.userId!==current)return toast('You can delete only your posts');
  db.posts=db.posts.filter(x=>x.id!==id);
  save();
  renderAll();
  toast('Post deleted');
}

function openUpload(){showTab('upload');document.getElementById('uploadTitle').textContent='Create Post';selected=null}

document.getElementById('fileInput').onchange=e=>{
  let f=e.target.files[0];
  if(!f)return;
  selected=f;
  previewUrl=URL.createObjectURL(f);
  previewType=f.type.startsWith('video')?'video':'image';
  document.getElementById('preview').innerHTML=previewType==='video'?`<video src="${previewUrl}" controls></video>`:`<img src="${previewUrl}">`;
}

function filterPreview(f){
  previewFilter=f;
  let x=document.querySelector('#preview img,#preview video');
  if(!x)return; 
  x.style.filter=f==='brightness'?'brightness(1.25)':f==='contrast'?'contrast(1.35)':f==='grayscale'?'grayscale(1)':f==='sepia'?'sepia(1)':'';
}

function resetPreview(){
  previewFilter='';
  let x=document.querySelector('#preview img,#preview video');
  if(x)x.style.filter='';
}

function publish(){
  if(!selected)return toast('Select a photo or video first');
  let r=new FileReader();
  r.onload=()=>{
    db.posts.push({id:crypto.randomUUID(),userId:current,data:r.result,type:previewType,caption:document.getElementById('caption').value,time:Date.now(),likes:[],saved:[],comments:[]});
    save();
    document.getElementById('caption').value='';
    document.getElementById('fileInput').value='';
    document.getElementById('preview').textContent='Select a photo or video';
    selected=null;
    showTab('home');
    toast('Published!');
  };
  r.readAsDataURL(selected);
}

function renderReels(){
  let list=document.getElementById('reelsList');
  let reels=db.posts.filter(p=>p.type==='video').sort((a,b)=>b.time-a.time);
  list.innerHTML=reels.map(p=>{
    let u=userById(p.userId);
    return `<div class="reel">
      <video src="${p.data}" controls loop playsinline></video>
      <div class="reel-info"><b>@${esc(u?.username||'user')}</b><div>${esc(p.caption||'')}</div></div>
      <div class="reel-actions">
        <button class="action" onclick="likePost('${p.id}')">♥</button>
        <button class="action" onclick="openComments('${p.id}')">💬</button>
        <button class="action" onclick="sharePost('${p.id}')">➤</button>
      </div>
    </div>`;
  }).join('')||'<div style="padding:40px;text-align:center;color:#777">Upload a video to see it here.</div>';
}

function searchUsers(q){
  q=q.trim().toLowerCase();
  let box=document.getElementById('searchResults');
  if(!q){box.innerHTML='<div style="padding:30px;text-align:center;color:#777">Search for a username</div>';return}
  let users=db.users.filter(u=>u.username.includes(q)||u.name.toLowerCase().includes(q));
  box.innerHTML=users.map(u=>`<div class="search-result" onclick="openUser('${u.id}')">
    <div class="small-avatar" ${avatarStyle(u.pic)}></div>
    <div><b>${esc(u.username)}</b><div style="color:#888">${esc(u.name)}</div></div>
  </div>`).join('')||'<div style="padding:30px;text-align:center;color:#777">No user found</div>';
}

function openUser(id){
  profileUser=id;
  let u=userById(id);
  if(!u)return;
  document.getElementById('personAvatar').setAttribute('style',u.pic?`background-image:url('${u.pic}')`: '');
  document.getElementById('personName').textContent=u.name;
  document.getElementById('personUsername').textContent='@'+u.username;
  
  let myObj=me();
  myObj.following = myObj.following || [];
  let isFollowing = myObj.following.includes(id);
  let followBtn = document.getElementById('personFollowBtn');
  followBtn.textContent = isFollowing ? 'Following' : 'Follow';
  followBtn.className = isFollowing ? 'secondary following-btn' : 'primary';

  let followersCount = db.users.filter(usr=>(usr.following||[]).includes(id)).length;
  let followingCount = (u.following||[]).length;
  document.getElementById('personFollowerCount').textContent = followersCount;
  document.getElementById('personFollowingCount').textContent = followingCount;

  let ps=db.posts.filter(p=>p.userId===id);
  document.getElementById('personPhotoTitle').textContent=`Photos (${ps.length})`;
  document.getElementById('personGrid').innerHTML=ps.map(p=>`<div class="grid-item" onclick="openPostModal('${p.id}')">${p.type==='video'?`<video src="${p.data}" muted></video>`:`<img src="${p.data}">`}</div>`).join('')||'<div style="grid-column:1/-1;padding:30px;text-align:center;color:#777">No posts</div>';
  showTab('personProfile');
}

function toggleFollowPerson(){
  if(!profileUser)return;
  let myObj=me();
  myObj.following = myObj.following || [];
  let index = myObj.following.indexOf(profileUser);
  if(index>=0){
    myObj.following.splice(index, 1);
    toast('Unfollowed');
  }else{
    myObj.following.push(profileUser);
    toast('Followed');
  }
  save();
  openUser(profileUser);
}

function startProfileChat(){
  if(!profileUser)return;
  openChatWith(profileUser);
}

function changeProfilePic(){
  document.getElementById('profileInput').click();
}

function saveProfilePic(e){
  let f=e.target.files[0];
  if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    let myObj=me();
    if(myObj){
      myObj.pic=r.result;
      save();
      renderProfile();
      toast('Profile picture updated!');
    }
  };
  r.readAsDataURL(f);
}

function switchProfileTab(tab){
  profileTab=tab;
  document.getElementById('btnMyPosts').classList.toggle('active', tab==='posts');
  document.getElementById('btnSavedPosts').classList.toggle('active', tab==='saved');
  renderProfileGrid();
}

function renderProfile(){
  let myObj=me();
  if(!myObj) return;
  document.getElementById('myAvatar').style.backgroundImage = myObj.pic ? `url('${myObj.pic}')` : '';
  document.getElementById('myName').textContent = myObj.name;
  let myPosts = db.posts.filter(p=>p.userId===current);
  document.getElementById('postCount').textContent = myPosts.length;
  document.getElementById('followerCount').textContent = db.users.filter(u=>(u.following||[]).includes(current)).length;
  document.getElementById('followingCount').textContent = (myObj.following||[]).length;
  renderProfileGrid();
}

function renderProfileGrid(){
  let posts = [];
  if(profileTab==='posts'){
    posts = db.posts.filter(p=>p.userId===current);
  }else{
    posts = db.posts.filter(p=>(p.saved||[]).includes(current));
  }
  document.getElementById('myGrid').innerHTML = posts.map(p=>`<div class="grid-item" onclick="openPostModal('${p.id}')">${p.type==='video'?`<video src="${p.data}" muted></video>`:`<img src="${p.data}">`}</div>`).join('') || '<div style="grid-column:1/-1;padding:30px;text-align:center;color:#777">No posts</div>';
}

function openChatList(){
  showTab('chat');
  backChats();
}

function backChats(){
  document.getElementById('chatListView').classList.remove('hidden');
  document.getElementById('chatRoom').classList.add('hidden');
  activeChat=null;
}

function openChatWith(userId){
  showTab('chat');
  activeChat=userId;
  let u=userById(userId);
  document.getElementById('chatTitle').textContent = u ? u.username : 'Chat';
  document.getElementById('chatListView').classList.add('hidden');
  document.getElementById('chatRoom').classList.remove('hidden');
  renderMessages();
}

function renderChats(){
  let box=document.getElementById('chatList');
  let users=db.users.filter(u=>u.id!==current);
  box.innerHTML=users.map(u=>`<div class="chat-row" onclick="openChatWith('${u.id}')">
    <div class="small-avatar" ${avatarStyle(u.pic)}></div>
    <div><b>${esc(u.username)}</b><div style="color:#888;font-size:12px">${esc(u.name)}</div></div>
  </div>`).join('')||'<div style="padding:20px;text-align:center;color:#777">No other users found</div>';
}

function renderMessages(){
  if(!activeChat)return;
  let chatKey=[current,activeChat].sort().join('_');
  let msgs=db.chats[chatKey]||[];
  let box=document.getElementById('messages');
  box.innerHTML=msgs.map(m=>`<div class="bubble ${m.from===current?'sent':'received'}">${esc(m.text)}</div>`).join('');
  box.scrollTop=box.scrollHeight;
}

function sendMessage(){
  let inp=document.getElementById('messageInput');
  let txt=inp.value.trim();
  if(!txt||!activeChat)return;
  let chatKey=[current,activeChat].sort().join('_');
  db.chats[chatKey]=db.chats[chatKey]||[];
  db.chats[chatKey].push({from:current,text:txt,time:Date.now()});
  inp.value='';
  save();
  renderMessages();
}

window.onload=()=>{
  let s=localStorage.getItem('universe_session');
  if(s && userById(s)){
    current=s;
    appScreen();
  }else{
    loginScreen();
  }
};
</script>
</body>
</html>
