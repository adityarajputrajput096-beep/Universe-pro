<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe Pro</title>

    <!-- Mobile App Installable & PWA Meta Tags -->
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Universe Pro">

    <!-- Aapka purana CSS ya Styling yahan ho toh rehne dein -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .install-container {
            margin-top: 20px;
        }
        #installAppBtn {
            display: none; 
            padding: 12px 24px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: bold; 
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
    </style>
</head>
<body>

    <!-- Aapka App ka Main Content yahan rahega -->
    <h1>Universe Pro</h1>
    <p>Aapka social media web application tayar hai!</p>

    <!-- Phone mein App Download / Install karne ka Button -->
    <div class="install-container">
        <button id="installAppBtn">📥 Download Universe Pro App</button>
    </div>

    <!-- PWA Install Script -->
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block'; // Jab app install hone layak hogi tab button dikhega
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User ne Universe Pro install kar liya!');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
    </script>

</body>
</html>
