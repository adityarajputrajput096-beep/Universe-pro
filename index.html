<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe Pro - Updated UI</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ग्लोबल स्टाइल्स --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: #fff; overflow-x: hidden; }
        
        #app-container {
            width: 100%; max-width: 450px; margin: 0 auto; height: 100vh;
            background-color: #121212; position: relative; border-left: 1px solid #333; border-right: 1px solid #333;
            display: flex; flex-direction: column;
        }

        /* --- टॉप हेडर --- */
        .top-header {
            padding: 15px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: center;
        }
        .top-header h2 { font-size: 20px; font-weight: 600; }

        /* --- मेन कंटेंट एरिया --- */
        .main-content { flex: 1; overflow-y: auto; padding-bottom: 60px; }
        .tab-section { display: none; height: 100%; }
        .tab-section.active { display: block; }

        /* --- 1. होम फीड --- */
        .post { padding: 15px; border-bottom: 1px solid #262626; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #444; cursor: pointer; object-fit: cover; }
        .post-content { height: 250px; background-color: #262626; border-radius: 8px; margin-bottom: 10px; }

        /* --- 2. सर्च बार और ग्लोबल चैट (अपडेटेड) --- */
        .search-container { padding: 15px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #262626; }
        .search-box {
            flex: 1; background: #262626; border-radius: 20px; padding: 10px 15px;
            display: flex; align-items: center; gap: 10px;
        }
        .search-box input {
            background: transparent; border: none; color: white; outline: none; width: 100%;
        }
        .global-chat-btn {
            background: #0078ff; color: white; border: none; padding: 10px 15px;
            border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px;
        }

        /* --- 3. रील्स सेक्शन (बिना सर्च के) --- */
        .reel-container { height: 100%; display: flex; justify-content: center; align-items: center; background: #1a1a1a; position: relative;}
        .reel-actions { position: absolute; right: 15px; bottom: 80px; display: flex; flex-direction: column; gap: 20px; font-size: 24px; }

        /* --- 4. खुद की प्रोफाइल (बिना टॉप चैट/सर्च के) --- */
        .profile-header-info { text-align: center; padding: 30px 15px; border-bottom: 1px solid #262626; }
        .profile-header-info .avatar { width: 80px; height: 80px; margin: 0 auto 10px auto; cursor: default; }

        /* --- 5. दूसरे यूजर की प्रोफाइल (चैट और + बटन के साथ) --- */
        #other-user-profile {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; z-index: 100; transform: translateX(100%); transition: transform 0.3s ease;
        }
        #other-user-profile.open { transform: translateX(0); }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        
        .action-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .btn-add {
            background: #262626; color: white; border: none; width: 40px; height: 40px;
            border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .btn-private-chat {
            background: #0078ff; color: white; border: none; padding: 0 30px;
            border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }

        /* --- बॉटम नेविगेशन --- */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 60px; background: #000;
            border-top: 1px solid #262626; display: flex; justify-content: space-around; align-items: center; z-index: 50;
        }
        .nav-item { color: #888; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #fff; }

    </style>
</head>
<body>

<div id="app-container">

    <!-- मेन कंटेंट एरिया -->
    <div class="main-content">
        
        <!-- 1. होम सेक्शन -->
        <div id="home" class="tab-section active">
            <div class="top-header">
                <h2>Universe Pro</h2>
            </div>
            <!-- डमी पोस्ट -->
            <div class="post">
                <div class="post-header">
                    <!-- इस अवतार पर क्लिक करने से दूसरे व्यक्ति की प्रोफाइल खुलेगी -->
                    <img src="https://i.pravatar.cc/150?img=11" alt="User" class="avatar" onclick="openUserProfile('Rahul Sharma', 'https://i.pravatar.cc/150?img=11')">
                    <div>
                        <strong>Rahul Sharma</strong>
                        <div style="font-size: 12px; color: #888;">2 hours ago</div>
                    </div>
                </div>
                <div class="post-content"></div>
                <div style="margin-top: 10px;"><i class="far fa-heart"></i> <i class="far fa-comment"></i></div>
            </div>
        </div>

        <!-- 2. सर्च और ग्लोबल चैट सेक्शन (अपडेटेड) -->
        <div id="search" class="tab-section">
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search" style="color: #888;"></i>
                    <input type="text" placeholder="Search anyone...">
                </div>
                <!-- अनजाने लोगों से या पब्लिक चैट करने के लिए ग्लोबल बटन -->
                <button class="global-chat-btn" onclick="alert('Global Chat Room Opened!')">
                    <i class="fas fa-globe"></i> Chat
                </button>
            </div>
            <div style="padding: 15px; color: #888; text-align: center; margin-top: 50px;">
                <i class="fas fa-users" style="font-size: 40px; margin-bottom: 10px; color: #444;"></i>
                <p>Search for people or join the global conversation.</p>
            </div>
        </div>

        <!-- 3. रील्स सेक्शन (यहां कोई सर्च बार नहीं है) -->
        <div id="reels" class="tab-section">
            <div class="reel-container">
                <div style="color: #fff; font-size: 20px;">Reel Playing...</div>
                <div class="reel-actions">
                    <i class="fas fa-heart"></i>
                    <i class="fas fa-comment"></i>
                    <i class="fas fa-share"></i>
                </div>
            </div>
        </div>

        <!-- 4. खुद की प्रोफाइल (ऊपर से सर्च और चैट हटाया गया) -->
        <div id="profile" class="tab-section">
            <div class="top-header">
                <h2>My Profile</h2>
                <!-- यहां से चैट और सर्च आइकन हटा दिए गए हैं -->
                <i class="fas fa-bars"></i>
            </div>
            <div class="profile-header-info">
                <img src="https://i.pravatar.cc/150?img=50" alt="My Profile" class="avatar">
                <h3>Adit Bhai</h3>
                <p style="color: #888; font-size: 14px; margin-top: 5px;">Web Developer | Gamer</p>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px;">
                <div style="width: 33%; height: 120px; background: #262626;"></div>
                <div style="width: 33%; height: 120px; background: #333;"></div>
                <div style="width: 33%; height: 120px; background: #262626;"></div>
            </div>
        </div>
    </div>

    <!-- 5. दूसरे व्यक्ति की प्रोफाइल स्क्रीन (क्लिक करने पर खुलेगी) -->
    <div id="other-user-profile">
        <div class="top-header">
            <button class="back-btn" onclick="closeUserProfile()"><i class="fas fa-arrow-left"></i></button>
            <h2 id="other-user-name">User Name</h2>
            <i class="fas fa-ellipsis-v"></i>
        </div>
        <div class="profile-header-info">
            <img id="other-user-img" src="" alt="User" class="avatar" style="cursor: default;">
            <h3 id="other-user-title">User Name</h3>
            
            <!-- एक्शन बटन्स (+ और प्राइवेट चैट) -->
            <div class="action-buttons">
                <button class="btn-add" onclick="alert('Follow request sent!')">
                    <i class="fas fa-plus"></i>
                </button>
                <button class="btn-private-chat" onclick="alert('Private chat opened with this user!')">
                    <i class="fas fa-comment-alt"></i> Chat
                </button>
            </div>
        </div>
    </div>

    <!-- बॉटम नेविगेशन बार -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-home"></i></div>
        <div class="nav-item" onclick="switchTab('search', this)"><i class="fas fa-search"></i></div>
        <div class="nav-item" onclick="switchTab('reels', this)"><i class="fas fa-video"></i></div>
        <div class="nav-item" onclick="switchTab('profile', this)"><i class="fas fa-user"></i></div>
    </div>

</div>

<script>
    // टैब्स बदलने का लॉजिक
    function switchTab(tabId, element) {
        // सारे सेक्शन छुपाओ
        document.querySelectorAll('.tab-section').forEach(tab => {
            tab.classList.remove('active');
        });
        // नेविगेशन आइकॉन से एक्टिव क्लास हटाओ
        document.querySelectorAll('.nav-item').forEach(nav => {
            nav.classList.remove('active');
        });

        // जो क्लिक हुआ है उसे दिखाओ
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    // किसी दूसरे की प्रोफाइल खोलने का लॉजिक (अकेले आदमी से बात करने के लिए)
    function openUserProfile(name, imageSrc) {
        document.getElementById('other-user-name').innerText = name;
        document.getElementById('other-user-title').innerText = name;
        document.getElementById('other-user-img').src = imageSrc;
        
        document.getElementById('other-user-profile').classList.add('open');
    }

    // दूसरे की प्रोफाइल बंद करने का लॉजिक
    function closeUserProfile() {
        document.getElementById('other-user-profile').classList.remove('open');
    }
</script>

</body>
</html>
