<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universe Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:#000;color:#fff;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#000}
.auth-card{width:min(380px,100%);background:#121212;border:1px solid #303030;border-radius:14px;padding:36px 28px;box-shadow:0 15px 50px #000}
.logo{font-size:38px;font-weight:800;text-align:center;margin-bottom:28px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888,#5851db);-webkit-background-clip:text;color:transparent}
.input{width:100%;padding:12px;margin:6px 0;background:#242424;color:#fff;border:1px solid #444;border-radius:7px;outline:none}
.primary{width:100%;border:0;background:#0095f6;color:white;padding:11px;border-radius:7px;font-weight:700;margin-top:8px}
.switch{text-align:center;color:#aaa;margin-top:18px;font-size:14px}.switch span{color:#0095f6;font-weight:700;cursor:pointer}
.note{font-size:11px;color:#777;text-align:center;margin-top:16px;line-height:1.4}
#app{display:none;min-height:100vh;padding-top:56px;padding-bottom:65px}
.header{height:56px;position:fixed;top:0;left:0;right:0;z-index:100;background:#000;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.header .brand{font-size:24px;font-weight:800}
.header-icons{display:flex;gap:18px;font-size:22px}
.icon-btn{background:none;border:0;color:#fff;font-size:22px}
main{width:min(650px,100%);margin:auto}
.tab{display:none}.tab.active{display:block}
.stories{display:flex;gap:14px;overflow:auto;padding:13px 14px;border-bottom:1px solid #252525;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{text-align:center;min-width:68px;font-size:11px}.ring{width:62px;height:62px;padding:2px;border-radius:50%;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);margin:auto}.avatar{width:100%;height:100%;border-radius:50%;background:#252525;border:2px solid #000;background-size:cover;background-position:center}
.post{border-bottom:1px solid #252525;margin-bottom:10px}.post-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px}.person{display:flex;gap:10px;align-items:center}.small-avatar{width:34px;height:34px;border-radius:50%;background:#333;background-size:cover;background-position:center}
.post-media{width:100%;max-height:650px;background:#080808;display:flex;justify-content:center}.post-media img,.post-media video{max-width:100%;max-height:650px;object-fit:contain}
.actions{display:flex;justify-content:space-between;padding:10px 14px;font-size:23px}.actions-left{display:flex;gap:17px}.action{border:0;background:none;color:#fff}.liked{color:#ff3040}
.details{padding:0 14px 14px;font-size:14px}.likes{font-weight:700;margin-bottom:5px}.caption b{margin-right:5px}.comment-link{color:#888;font-size:13px;margin-top:7px}
.search-box{padding:13px;border-bottom:1px solid #252525}.search-box input{width:100%;padding:12px;border:0;border-radius:9px;background:#242424;color:#fff;outline:none}
.search-result{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #202020;cursor:pointer}.search-result:hover{background:#151515}
.profile{padding-bottom:20px}.profile-top{display:flex;gap:24px;align-items:center;padding:25px 18px;border-bottom:1px solid #252525}.profile-avatar{width:88px;height:88px;border-radius:50%;background:#222;background-size:cover;background-position:center;border:2px solid #444}
.stats{display:flex;gap:22px;text-align:center}.stat strong{display:block;font-size:18px}.bio{padding:15px 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid-item{aspect-ratio:1;background:#111;overflow:hidden}.grid-item img,.grid-item video{width:100%;height:100%;object-fit:cover}
.profile-actions{display:flex;gap:8px;padding:0 18px 15px}.secondary{flex:1;background:#262626;color:#fff;border:1px solid #444;padding:9px;border-radius:7px;font-weight:700}
.user-profile{padding-bottom:30px}.user-head{display:flex;gap:20px;padding:24px 18px;align-items:center}.user-actions{display:flex;gap:8px;padding:0 18px 20px}.user-actions button{flex:1}
.section-title{font-weight:700;padding:15px 18px;border-top:1px solid #252525}
.reels{height:calc(100vh - 121px);overflow-y:auto;scroll-snap-type:y mandatory;background:#000}.reel{height:calc(100vh - 121px);scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#050505}.reel video{width:100%;height:100%;object-fit:contain}.reel-info{position:absolute;left:16px;bottom:24px;text-shadow:0 2px 5px #000}.reel-actions{position:absolute;right:14px;bottom:25px;display:flex;flex-direction:column;gap:18px;font-size:25px}
.chat-list{padding:8px}.chat-row{display:flex;gap:12px;padding:14px;border-bottom:1px solid #222;align-items:center;cursor:pointer}.chat-room{height:calc(100vh - 121px);display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:75%;padding:10px 13px;border-radius:15px;background:#292929}.sent{align-self:flex-end;background:#0084ff}.received{align-self:flex-start}.chat-input{display:flex;padding:10px;gap:8px;border-top:1px solid #222}.chat-input input{flex:1;background:#242424;border:0;border-radius:20px;color:#fff;padding:11px 14px;outline:none}.chat-input button{border:0;background:#0095f6;color:#fff;border-radius:20px;padding:0 17px;font-weight:700}
.upload{padding:16px}.preview{height:390px;background:#0b0b0b;border:1px dashed #444;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img,.preview video{max-width:100%;max-height:100%}.toolbar{display:flex;gap:8px;overflow:auto;padding:12px 0}.chip{white-space:nowrap;background:#262626;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:18px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:56px;background:#000;border-top:1px solid #252525;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom button{background:none;border:0;color:#fff;font-size:22px}
.modal{position:fixed;inset:0;background:#000e;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}.modal-card{background:#181818;border:1px solid #444;border-radius:12px;width:min(400px,100%);max-height:80vh;overflow:auto}.modal-head{padding:15px;border-bottom:1px solid #333;display:flex;justify-content:space-between;font-weight:700}.modal-body{padding:15px}
.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;display:none;z-index:1000;font-size:13px}
@media(max-width:500px){main{width:100%}.profile-top{gap:15px}.stats{gap:13px}.preview{height:330px}}
</style>
</head>
<body>

<section id="auth">
  <div class="auth-card">
    <div class="logo">Universe Pro</div>
    <form id="authForm">
      <input id="fullName" class="input hidden" placeholder="Full name">
      <input id="username" class="input" placeholder="Username" autocomplete="username" required>
      <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="primary" id="authBtn">Log In</button>
    </form>
    <div class="switch"><span id="switchText">Don't have an account?</span> <span id="switchBtn">Sign up</span></div>
    <div class="note">Demo app: accounts are stored only in this browser. This is not production-grade password security.</div>
  </div>
</section>

<div id="app">
<header class="header">
  <div class="brand">Universe Pro</div>
  <div class="header-icons"><button class="icon-btn" onclick="openChatList()">💬</button><button class="icon-btn" onclick="openUpload()">➕</button></div>
</header>

<main>
<section id="home" class="tab active">
  <div class="stories" id="stories"></div><div id="feed"></div>
</section>

<section id="search" class="tab">
  <div class="search-box"><input id="searchInput" placeholder="Search people..." oninput="searchUsers(this.value)"></div>
  <div id="searchResults"></div>
</section>

<section id="reels" class="tab">
  <div class="reels" id="reelsList"></div>
</section>

<section id="upload" class="tab">
  <div class="upload">
    <h3 id="uploadTitle">Create Post</h3>
    <input id="fileInput" type="file" accept="image/,video/" style="margin:14px 0">
    <div class="preview" id="preview">Select a photo or video</div>
    <div class="toolbar"><button class="chip" onclick="filterPreview('brightness')">💡 Brightness</button><button class="chip" onclick="filterPreview('contrast')">🌓 Contrast</button><button class="chip" onclick="filterPreview('grayscale')">🎞️ B&W</button><button class="chip" onclick="filterPreview('sepia')">📜 Vintage</button><button class="chip" onclick="resetPreview()">🔄 Reset</button></div>
    <input id="caption" class="input" placeholder="Write a caption...">
    <button class="primary" onclick="publish()">Publish</button>
  </div>
</section>

<section id="chat" class="tab">
  <div id="chatListView"><div class="section-title">Messages</div><div class="chat-list" id="chatList"></div></div>
  <div id="chatRoom" class="chat-room hidden">
    <div class="section-title"><button class="action" onclick="backChats()">←</button> <span id="chatTitle"></span></div>
    <div class="messages" id="messages"></div>
    <div class="chat-input"><input id="messageInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">Send</button></div>
  </div>
</section>

<section id="profile" class="tab"><div class="profile">
  <div class="profile-top"><div id="myAvatar" class="profile-avatar"></div><div class="stats"><div class="stat"><strong id="postCount">0</strong>posts</div><div class="stat"><strong id="followerCount">0</strong>followers</div><div class="stat"><strong>0</strong>following</div></div></div>
  <div class="bio"><b id="myName"></b><p style="color:#aaa;margin-top:5px">Welcome to my Universe Pro 🚀</p></div>
  <div class="profile-actions"><button class="secondary" onclick="changeProfilePic()">Change photo</button><button class="secondary" onclick="logout()">Log out</button></div>
  <input id="profileInput" type="file" accept="image/*" class="hidden" onchange="saveProfilePic(event)">
  <div class="grid" id="myGrid"></div>
</div></section>

<section id="personProfile" class="tab"><div class="user-profile">
  <div class="user-head"><div id="personAvatar" class="profile-avatar"></div><div><h2 id="personName"></h2><div style="color:#aaa;margin-top:5px" id="personUsername"></div></div></div>
  <div class="user-actions"><button class="primary" onclick="startProfileChat()">💬 Chat</button><button class="secondary" onclick="showPersonPhotos()">📷 Photos</button></div>
  <div class="section-title" id="personPhotoTitle">Photos</div><div class="grid" id="personGrid"></div>
</div></section>
</main>

<nav class="bottom"><button onclick="showTab('home')">🏠</button><button onclick="showTab('search')">🔍</button><button onclick="openUpload()">➕</button><button onclick="showTab('reels')">🎬</button><button onclick="showTab('profile')">👤</button></nav>
</div>

<div id="toast" class="toast"></div>
<div id="storyModal" class="modal hidden" onclick="closeStory()"><div class="modal-card" onclick="event.stopPropagation()"><div class="modal-head"><span id="storyUser"></span><button class="action" onclick="closeStory()">✕</button></div><div class="modal-body" id="storyBody"></div></div></div>

<script>
const KEY='universe_pro_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],posts:[],stories:[],chats:{}};
let current=null, signup=false, selected=null, previewUrl='', previewType='', previewFilter='', activeChat=null, profileUser=null;

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function userById(id){return db.users.find(u=>u.id===id)}
function me(){return userById(current)}
function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='home')renderFeed();if(id==='reels')renderReels();if(id==='profile')renderProfile();if(id==='chat')renderChats()}
function loginScreen(){document.getElementById('auth').style.display='flex';document.getElementById('app').style.display='none'}
function appScreen(){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';renderAll()}
document.getElementById('switchBtn').onclick=()=>{signup=!signup;document.getElementById('fullName').classList.toggle('hidden',!signup);document.getElementById('fullName').required=signup;document.getElementById('authBtn').textContent=signup?'Sign Up':'Log In';document.getElementById('switchText').textContent=signup?'Already have an account?':"Don't have an account?";document.getElementById('switchBtn').textContent=signup?'Log in':'Sign up'}
document.getElementById('authForm').onsubmit=e=>{e.preventDefault();let u=document.getElementById('username').value.trim().toLowerCase(),p=document.getElementById('password').value,n=document.getElementById('fullName').value.trim();if(signup){if(!n)return toast('Enter your name');if(db.users.some(x=>x.username===u))return toast('Username already exists');let obj={id:crypto.randomUUID(),name:n,username:u,password:p,pic:'',created:Date.now()};db.users.push(obj);save();current=obj.id;localStorage.setItem('universe_session',current);appScreen();toast('Account created')}else{let obj=db.users.find(x=>x.username===u&&x.password===p);if(!obj)return toast('Wrong username or password');current=obj.id;localStorage.setItem('universe_session',current);appScreen();toast('Logged in')}}
function logout(){localStorage.removeItem('universe_session');current=null;loginScreen()}
function renderAll(){renderStories();renderFeed();renderReels();renderProfile();renderChats()}
function avatarStyle(pic){return pic?style="background-image:url('${pic}')":''}
function renderStories(){let s=document.getElementById('stories');s.innerHTML=db.users.map(u=><div class="story" onclick="openUserStory('${u.id}')"><div class="ring"><div class="avatar" ${avatarStyle(u.pic)}></div></div><div>${esc(u.username)}</div></div>).join('')||'<div style="padding:20px;color:#777">No users yet</div>'}
function renderFeed(){let f=document.getElementById('feed');let posts=[...db.posts].sort((a,b)=>b.time-a.time);f.innerHTML=posts.map(post=>{let u=userById(post.userId);if(!u)return '';let liked=(post.likes||[]).includes(current);return <article class="post"><div class="post-head"><div class="person" onclick="openUser('${u.id}')"><div class="small-avatar" ${avatarStyle(u.pic)}></div><b>${esc(u.username)}</b></div><button class="action" onclick="deletePost('${post.id}')">⋯</button></div><div class="post-media" ondblclick="likePost('${post.id}')">${post.type==='video'?<video src="${post.data}" controls></video>:<img src="${post.data}" alt="post">}</div><div class="actions"><div class="actions-left"><button class="action ${liked?'liked':''}" onclick="likePost('${post.id}')">${liked?'♥️':'♡'}</button><button class="action" onclick="toast('Comments are below the post')">💬</button><button class="action" onclick="sharePost('${post.id}')">➤</button></div><button class="action" onclick="savePost('${post.id}')">🔖</button></div><div class="details"><div class="likes">${post.likes?.length||0} likes</div><div class="caption"><b>${esc(u.username)}</b>${esc(post.caption||'')}</div></div></article>}).join('')||'<div style="padding:40px;text-align:center;color:#777">No posts yet. Create the first one!</div>'}
function likePost(id){let p=db.posts.find(x=>x.id===id);p.likes=p.likes||[];let i=p.likes.indexOf(current);i>=0?p.likes.splice(i,1):p.likes.push(current);save();renderFeed();renderProfile()}
function savePost(id){let p=db.posts.find(x=>x.id===id);p.saved=p.saved||[];let i=p.saved.indexOf(current);i>=0?p.saved.splice(i,1):p.saved.push(current);save();toast(i>=0?'Removed from saved':'Saved')}
function sharePost(id){navigator.clipboard?.writeText(location.href).then(()=>toast('Link copied')).catch(()=>toast('Share link ready'))}
function deletePost(id){let p=db.posts.find(x=>x.id===id);if(p?.userId!==current)return toast('You can delete only your posts');db.posts=db.posts.filter(x=>x.id!==id);save();renderAll();toast('Post deleted')}
function openUpload(){showTab('upload');document.getElementById('uploadTitle').textContent='Create Post';selected=null}
document.getElementById('fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;selected=f;previewUrl=URL.createObjectURL(f);previewType=f.type.startsWith('video')?'video':'image';document.getElementById('preview').innerHTML=previewType==='video'?<video src="${previewUrl}" controls></video>:<img src="${previewUrl}">}
function filterPreview(f){previewFilter=f;let x=document.querySelector('#preview img,#preview video');if(!x)return; x.style.filter=f==='brightness'?'brightness(1.25)':f==='contrast'?'contrast(1.35)':f==='grayscale'?'grayscale(1)':f==='sepia'?'sepia(1)':''}
function resetPreview(){previewFilter='';let x=document.querySelector('#preview img,#preview video');if(x)x.style.filter=''}
function publish(){if(!selected)return toast('Select a photo or video first');let r=new FileReader();r.onload=()=>{db.posts.push({id:crypto.randomUUID(),userId:current,data:r.result,type:previewType,caption:document.getElementById('caption').value,time:Date.now(),likes:[],saved:[]});save();document.getElementById('caption').value='';document.getElementById('fileInput').value='';document.getElementById('preview').textContent='Select a photo or video';selected=null;showTab('home');toast('Published!')};r.readAsDataURL(selected)}
function renderReels(){let list=document.getElementById('reelsList');let reels=db.posts.filter(p=>p.type==='video').sort((a,b)=>b.time-a.time);list.innerHTML=reels.map(p=>{let u=userById(p.userId);return <div class="reel"><video src="${p.data}" controls loop playsinline></video><div class="reel-info"><b>@${esc(u?.username||'user')}</b><div>${esc(p.caption||'')}</div></div><div class="reel-actions"><button class="action" onclick="likePost('${p.id}')">♥️</button><button class="action" onclick="sharePost('${p.id}')">➤</button></div></div>}).join('')||'<div style="padding:40px;text-align:center;color:#777">Upload a video to see it here.</div>'}
function searchUsers(q){q=q.trim().toLowerCase();let box=document.getElementById('searchResults');if(!q){box.innerHTML='<div style="padding:30px;text-align:center;color:#777">Search for a username</div>';return}let users=db.users.filter(u=>u.username.includes(q)||u.name.toLowerCase().includes(q));box.innerHTML=users.map(u=><div class="search-result" onclick="openUser('${u.id}')"><div class="small-avatar" ${avatarStyle(u.pic)}></div><div><b>${esc(u.username)}</b><div style="color:#888">${esc(u.name)}</div></div></div>).join('')||'<div style="padding:30px;text-align:center;color:#777">No user found</div>'}
function openUser(id){profileUser=id;let u=userById(id);if(!u)return;document.getElementById('personAvatar').setAttribute('style',u.pic?background-image:url('${u.pic}'): '');document.getElementById('personName').textContent=u.name;document.getElementById('personUsername').textContent='@'+u.username;let ps=db.posts.filter(p=>p.userId===id);document.getElementById('personPhotoTitle').textContent=Photos (${ps.length});document.getElementById('personGrid').innerHTML=ps.map(p=><div class="grid-item">${p.type==='video'?<video src="${p.data}" muted></video>:<img src="${p.data}">}</div>).join('')||'<div style="grid-column:1/-1;padding:30px;text-align:center;color:#777">No posts</div>';showTab('personProfile')}
function startProfileChat(){if(!profileUser)return;openChat(profileUser)}
function showPersonPhotos(){document.getElementById('personGrid').scrollIntoView({behavior:'smooth'})}
function renderProfile(){let u=me();if(!u)return;document.getElementById('myAvatar').setAttribute('style',u.pic?background-image:url('${u.pic}'):'');document.getElementById('myName').textContent=u.name+' (@'+u.username+')';document.getElementById('postCount').textContent=db.posts.filter(p=>p.userId===current).length;document.getElementById('followerCount').textContent=0;let ps=db.posts.filter(p=>p.userId===current);document.getElementById('myGrid').innerHTML=ps.map(p=><div class="grid-item">${p.type==='video'?<video src="${p.data}" muted></video>:<img src="${p.data}">}</div>).join('')}
function changeProfilePic(){document.getElementById('profileInput').click()}
document.getElementById('profileInput').onchange=saveProfilePic
function saveProfilePic(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{me().pic=r.result;save();renderAll();toast('Profile photo updated')};r.readAsDataURL(f)}
function openChatList(){showTab('chat');backChats()}
function renderChats(){let box=document.getElementById('chatList');let ids=[...new Set(Object.keys(db.chats).flatMap(k=>k.split('|')).filter(x=>x&&x!==current))];box.innerHTML=ids.map(id=>{let u=userById(id);return u?<div class="chat-row" onclick="openChat('${id}')"><div class="small-avatar" ${avatarStyle(u.pic)}></div><b>${esc(u.username)}</b></div>:''}).join('')||'<div style="padding:35px;text-align:center;color:#777">Open a user profile from Search and tap Chat.</div>'}
function chatKey(a,b){return[a,b].sort().join('|')}
function openChat(id){activeChat=id;let u=userById(id);showTab('chat');document.getElementById('chatListView').classList.add('hidden');document.getElementById('chatRoom').classList.remove('hidden');document.getElementById('chatTitle').textContent='@'+u.username;renderMessages()}
function backChats(){document.getElementById('chatListView').classList.remove('hidden');document.getElementById('chatRoom').classList.add('hidden');renderChats()}
function renderMessages(){let box=document.getElementById('messages'),arr=db.chats[chatKey(current,activeChat)]||[];box.innerHTML=arr.map(m=><div class="bubble ${m.from===current?'sent':'received'}">${esc(m.text)}</div>).join('');box.scrollTop=box.scrollHeight}
function sendMessage(){let input=document.getElementById('messageInput'),t=input.value.trim();if(!t||!activeChat)return;let k=chatKey(current,activeChat);db.chats[k]=db.chats[k]||[];db.chats[k].push({from:current,text:t,time:Date.now()});input.value='';save();renderMessages();renderChats()}
function openUserStory(id){let u=userById(id),story=db.stories.find(s=>s.userId===id);document.getElementById('storyUser').textContent='@'+u.username;document.getElementById('storyBody').innerHTML=story?<img src="${story.data}" style="max-width:100%">:'<p style="color:#aaa;text-align:center">No active story</p>';document.getElementById('storyModal').classList.remove('hidden')}
function closeStory(){document.getElementById('storyModal').classList.add('hidden')}
window.addEventListener('DOMContentLoaded',()=>{current=localStorage.getItem('universe_session');if(current&&userById(current))appScreen();else loginScreen()})
</script>
</body>
</html>
