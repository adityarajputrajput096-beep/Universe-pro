<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universe Pro - Live Firebase & Video Call</title>
<title>made by aditya helpline 888269376
<style>
:root{
  --bg:#000000;
  --card:#121212;
  --card-border:#262626;
  --accent:#0095f6;
  --like:#ff3040;
  --text:#ffffff;
  --muted:#a8a8a8;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;transition:transform 0.1s ease, opacity 0.2s ease}
button:active{transform:scale(0.96)}
.hidden{display:none!important}

#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#000}
.auth-card{width:min(380px,100%);background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:36px 28px;box-shadow:0 15px 50px rgba(0,0,0,0.8)}
.logo{font-size:38px;font-weight:800;text-align:center;margin-bottom:28px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888,#5851db);-webkit-background-clip:text;color:transparent}
.input{width:100%;padding:12px;margin:6px 0;background:#1e1e1e;color:#fff;border:1px solid #333;border-radius:8px;outline:none;transition:border-color 0.2s}
.input:focus{border-color:var(--accent)}
.primary{width:100%;border:0;background:var(--accent);color:white;padding:11px;border-radius:8px;font-weight:700;margin-top:8px}
.switch{text-align:center;color:var(--muted);margin-top:18px;font-size:14px}.switch span{color:var(--accent);font-weight:700;cursor:pointer}

#app{display:none;min-height:100vh;padding-top:56px;padding-bottom:65px}
.header{height:56px;position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.header .brand{font-size:24px;font-weight:800;background:linear-gradient(45deg,#fff,#ccc);-webkit-background-clip:text;color:transparent}
.header-icons{display:flex;gap:18px;font-size:22px}
.icon-btn{background:none;border:0;color:#fff;font-size:22px}

main{width:min(650px,100%);margin:auto}
.tab{display:none}.tab.active{display:block}

/* Stories Bar */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px;border-bottom:1px solid var(--card-border);scrollbar-width:none;background:#050505}
.stories::-webkit-scrollbar{display:none}
.story{text-align:center;min-width:68px;font-size:11px;cursor:pointer}
.ring{width:64px;height:64px;padding:2px;border-radius:50%;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);margin:auto}
.ring.add-story-ring{background:#222;border:2px dashed var(--accent)}
.avatar{width:100%;height:100%;border-radius:50%;background:#252525;border:2px solid #000;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold}

/* Post Cards */
.post{border-bottom:1px solid var(--card-border);margin-bottom:15px;background:var(--bg)}
.post-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.person{display:flex;gap:10px;align-items:center;cursor:pointer}
.small-avatar{width:36px;height:36px;border-radius:50%;background:#333;background-size:cover;background-position:center;border:1px solid #444}
.post-media{width:100%;max-height:650px;background:#050505;display:flex;justify-content:center;align-items:center;cursor:pointer;position:relative;overflow:hidden;border-radius:4px}
.post-media img,.post-media video{width:100%;max-height:650px;object-fit:contain}

.actions{display:flex;justify-content:space-between;padding:10px 14px;font-size:23px}
.actions-left{display:flex;gap:17px;align-items:center}
.action,.delete-btn{border:0;background:none;color:#fff;font-size:22px;cursor:pointer}
.liked{color:var(--like)}
.details{padding:0 14px 14px;font-size:14px}
.likes{font-weight:700;margin-bottom:6px}
.caption b{margin-right:6px}
.comment-link{color:var(--muted);font-size:13px;margin-top:6px;cursor:pointer}

/* Search Tab */
.search-box{padding:13px;border-bottom:1px solid var(--card-border)}
.search-box input{width:100%;padding:12px;border:0;border-radius:10px;background:#1e1e1e;color:#fff;outline:none}
.search-result{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #1a1a1a;cursor:pointer}
.search-result:hover{background:#121212}

/* Profile Tab */
.profile-top{display:flex;gap:24px;align-items:center;padding:25px 18px;border-bottom:1px solid var(--card-border)}
.profile-avatar{width:88px;height:88px;border-radius:50%;background:#222;background-size:cover;background-position:center;border:2px solid #444}
.stats{display:flex;gap:22px;text-align:center}
.stat strong{display:block;font-size:18px}
.bio{padding:15px 18px}
.profile-nav{display:flex;border-top:1px solid var(--card-border);border-bottom:1px solid var(--card-border)}
.profile-nav-btn{flex:1;padding:12px;background:none;border:0;color:var(--muted);font-weight:700;font-size:13px}
.profile-nav-btn.active{color:#fff;border-bottom:2px solid #fff}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid-item{aspect-ratio:1;background:#111;overflow:hidden;cursor:pointer;position:relative}
.grid-item img,.grid-item video{width:100%;height:100%;object-fit:cover}

.profile-actions{display:flex;gap:8px;padding:0 18px 15px}
.secondary{flex:1;background:#262626;color:#fff;border:1px solid #444;padding:9px;border-radius:8px;font-weight:700}

.user-profile{padding-bottom:30px}
.user-head{display:flex;gap:20px;padding:24px 18px;align-items:center}
.user-actions{display:flex;gap:8px;padding:0 18px 20px}
.user-actions button{flex:1}
.section-title{font-weight:700;padding:15px 18px;border-top:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between}

/* Reels */
.reels{height:calc(100vh - 121px);overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
.reel{height:calc(100vh - 121px);scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#050505}
.reel video{width:100%;height:100%;object-fit:contain}
.reel-info{position:absolute;left:16px;bottom:24px;text-shadow:0 2px 5px #000}
.reel-actions{position:absolute;right:14px;bottom:25px;display:flex;flex-direction:column;gap:18px;font-size:25px}

/* Chat */
.chat-list{padding:8px}
.chat-row{display:flex;gap:12px;padding:14px;border-bottom:1px solid #1c1c1c;align-items:center;cursor:pointer}
.chat-room{height:calc(100vh - 121px);display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:9px}
.bubble{max-width:75%;padding:10px 14px;border-radius:18px;background:#262626;font-size:14px;line-height:1.4}
.sent{align-self:flex-end;background:var(--accent);color:#fff}
.received{align-self:flex-start;background:#262626}
.chat-input{display:flex;padding:10px;gap:8px;border-top:1px solid var(--card-border);background:#000}
.chat-input input{flex:1;background:#1e1e1e;border:0;border-radius:20px;color:#fff;padding:11px 16px;outline:none}
.chat-input button{border:0;background:var(--accent);color:#fff;border-radius:20px;padding:0 18px;font-weight:700}

/* Upload */
.upload{padding:16px}
.preview{height:380px;background:#080808;border:1px dashed #444;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img,.preview video{max-width:100%;max-height:100%}

/* Bottom Nav */
.bottom {
  position: fixed;
  bottom: env(safe-area-inset-bottom);
  left: 0;
  right: 0;
  height: 56px;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--card-border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
.bottom button {
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 22px;
}
.bottom button.active-nav {
  color: #fff;
  transform: scale(1.1);
}

/* Modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:15px}
.modal-card{background:#181818;border:1px solid #333;border-radius:14px;width:min(440px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:15px;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.modal-body{padding:15px;overflow-y:auto;flex:1}
.comment-item{display:flex;gap:10px;margin-bottom:12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;display:none;z-index:1000;font-size:13px;font-weight:600}

/* Video Call Styles */
.video-container{position:relative;width:min(480px,100%);height:75vh;background:#000;border-radius:18px;overflow:hidden;border:1px solid #333;display:flex;align-items:center;justify-content:center}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#111}
#localVideo{position:absolute;top:16px;right:16px;width:110px;height:150px;border-radius:12px;border:2px solid #ffffff33;object-fit:cover;background:#222;z-index:10}
.video-controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:20;background:rgba(0,0,0,0.6);padding:10px 20px;border-radius:30px;backdrop-filter:blur(8px)}
.call-btn{width:50px;height:50px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.call-btn.off{background:#ff9800;color:#000}
.call-btn.hangup{background:#ff3040;color:#fff}
</style>
</head>
<body>

<section id="auth">
  <div class="auth-card">
    <div class="logo">Universe Pro adi</div>
    <form id="authForm">
      <input id="fullName" class="input hidden" placeholder="Full name">
      <input id="email" class="input" type="email" placeholder="Email address" required>
      <input id="username" class="input" placeholder="Username" required>
      <input id="password" class="input" type="password" placeholder="Password" required>
      <button class="primary" id="authBtn">Log In</button>
    </form>
    <div class="switch"><span id="switchText">Don't have an account?</span> <span id="switchBtn">Sign up</span></div>
  </div>
</section>

<div id="app">
<header class="header">
  <div class="brand">Universe Pro</div>
  <div class="header-icons">
    <button class="icon-btn" onclick="openChatList()">💬</button>
    <button class="icon-btn" onclick="openUpload()">➕</button>
  </div>
</header>

<main>
<section id="home" class="tab active">
  <div class="stories" id="stories"></div>
  <div id="feed"></div>
</section>

<section id="search" class="tab">
  <div class="search-box"><input id="searchInput" placeholder="Search people..." oninput="searchUsers(this.value)"></div>
  <div id="searchResults"></div>
</section>

<section id="reels" class="tab">
  <div class="reels" id="reelsList"></div>
</section>

<section id="upload" class="tab">
  <div class="upload">
    <h3 id="uploadTitle">Create Post</h3>
    <input id="fileInput" type="file" accept="image/*,video/*" style="margin:14px 0">
    <div class="preview" id="preview">Select a photo or video</div>
    <input id="caption" class="input" placeholder="Write a caption..." style="margin-top:10px;">
    <button class="primary" onclick="publish()">Publish Post</button>
  </div>
</section>

<section id="chat" class="tab">
  <div id="chatListView"><div class="section-title"><span>Messages</span></div><div class="chat-list" id="chatList"></div></div>
  <div id="chatRoom" class="chat-room hidden">
    <div class="section-title">
      <div><button class="action" onclick="backChats()">←</button> <span id="chatTitle"></span></div>
      <button class="action" onclick="startVideoCall()" style="font-size:22px;" title="Start Video Call">📹</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input"><input id="messageInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">Send</button></div>
  </div>
</section>

<section id="profile" class="tab">
  <div class="profile">
    <div class="profile-top">
      <div id="myAvatar" class="profile-avatar"></div>
      <div class="stats">
        <div class="stat"><strong id="postCount">0</strong>posts</div>
        <div class="stat"><strong id="followerCount">0</strong>followers</div>
        <div class="stat"><strong id="followingCount">0</strong>following</div>
      </div>
    </div>
    <div class="bio"><b id="myName"></b><p style="color:#aaa;margin-top:5px">Welcome to Universe Pro 🚀</p></div>
    <div class="profile-actions">
      <button class="secondary" onclick="changeProfilePic()">Change photo</button>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>
    <input id="profileInput" type="file" accept="image/*" class="hidden" onchange="saveProfilePic(event)">
    <div class="profile-nav">
      <button class="profile-nav-btn active" id="btnMyPosts" onclick="switchProfileTab('posts')">📷 POSTS</button>
      <button class="profile-nav-btn" id="btnSavedPosts" onclick="switchProfileTab('saved')">🔖 SAVED</button>
    </div>
    <div class="grid" id="myGrid"></div>
  </div>
</section>

<section id="personProfile" class="tab">
  <div class="user-profile">
    <div class="user-head">
      <div id="personAvatar" class="profile-avatar"></div>
      <div>
        <h2 id="personName"></h2>
        <div style="color:#aaa;margin-top:5px" id="personUsername"></div>
        <div style="display:flex;gap:15px;margin-top:10px;font-size:13px">
          <span><b id="personFollowerCount">0</b> followers</span>
          <span><b id="personFollowingCount">0</b> following</span>
        </div>
      </div>
    </div>
    <div class="user-actions">
      <button id="personFollowBtn" class="primary" onclick="toggleFollowPerson()">Follow</button>
      <button class="secondary" onclick="startProfileChat()">💬 Chat</button>
    </div>
    <div class="section-title" id="personPhotoTitle">Photos</div>
    <div class="grid" id="personGrid"></div>
  </div>
</section>
</main>

<nav class="bottom">
  <button id="nav-home" class="active-nav" onclick="showTab('home')">🏠</button>
  <button id="nav-search" onclick="showTab('search')">🔍</button>
  <button id="nav-upload" onclick="openUpload()">➕</button>
  <button id="nav-reels" onclick="showTab('reels')">🎬</button>
  <button id="nav-profile" onclick="showTab('profile')">👤</button>
</nav>
</div>

<div id="toast" class="toast"></div>

<!-- Video Call Modal -->
<div id="videoModal" class="modal hidden">
  <div class="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="video-controls">
      <button id="btnToggleCam" class="call-btn" onclick="toggleCamera()" title="Camera On/Off">📹</button>
      <button id="btnToggleMic" class="call-btn" onclick="toggleMic()" title="Mic Mute/Unmute">🎙️</button>
      <button class="call-btn hangup" onclick="endCall()" title="End Call">📞</button>
    </div>
  </div>
</div>

<!-- Story Modal -->
<div id="storyModal" class="modal hidden" onclick="closeStory()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head"><span id="storyUser"></span><button class="action" onclick="closeStory()">✕</button></div>
    <div class="modal-body" id="storyBody"></div>
  </div>
</div>
<input id="storyFileInput" type="file" accept="image/*" class="hidden" onchange="handleStoryUpload(event)">

<!-- Comments Modal -->
<div id="commentModal" class="modal hidden" onclick="closeComments()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head"><span>Comments</span><button class="action" onclick="closeComments()">✕</button></div>
    <div class="modal-body" id="commentsList"></div>
    <div class="chat-input" style="border-top:1px solid #333;">
      <input id="commentInput" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')submitComment()">
      <button onclick="submitComment()">Post</button>
    </div>
  </div>
</div>

<!-- Firebase Modular Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBSCxAOI0DGmGBc3V2emwJUECZfxt7fMoA",
    authDomain: "universe-pro-f36a8.firebaseapp.com",
    databaseURL: "https://universe-pro-f36a8-default-rtdb.firebaseio.com",
    projectId: "universe-pro-f36a8",
    storageBucket: "universe-pro-f36a8.firebasestorage.app",
    messagingSenderId: "1051673611050",
    appId: "1:1051673611050:web:24d6db4c72628131d42c53"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUid = null;
  let dbUsers = {}, dbPosts = {}, dbStories = {}, dbChats = {};
  let signup = false, selectedFile = null, previewUrl = '', previewType = '', activeChat = null, profileUser = null;
  let activeCommentPostId = null, profileTab = 'posts';

  // Video Call WebRTC State
  let localStream = null;
  let peerConnection = null;
  let isCamOn = true;
  let isMicOn = true;
  const rtcServers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

  function toast(msg){
    let x = document.getElementById('toast');
    x.textContent = msg;
    x.style.display = 'block';
    clearTimeout(window.tt);
    window.tt = setTimeout(()=>x.style.display='none', 1800);
  }

  function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) }
  function avatarStyle(pic){ return pic ? `style="background-image:url('${pic}')"` : '' }

  // Realtime Listeners
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUid = user.uid;
      document.getElementById('auth').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      listenToDatabase();
    } else {
      currentUid = null;
      document.getElementById('auth').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  function listenToDatabase() {
    onValue(ref(db, 'users'), snapshot => { dbUsers = snapshot.val() || {}; renderAll(); });
    onValue(ref(db, 'posts'), snapshot => { dbPosts = snapshot.val() || {}; renderAll(); });
    onValue(ref(db, 'stories'), snapshot => { dbStories = snapshot.val() || {}; renderStories(); });
    onValue(ref(db, 'chats'), snapshot => { dbChats = snapshot.val() || {}; if(activeChat) renderMessages(); });
  }

  function renderAll() {
    renderStories();
    renderFeed();
    renderReels();
    renderProfile();
    renderChats();
  }

  // Auth Handling
  document.getElementById('switchBtn').onclick = () => {
    signup = !signup;
    document.getElementById('fullName').classList.toggle('hidden', !signup);
    document.getElementById('authBtn').textContent = signup ? 'Sign Up' : 'Log In';
    document.getElementById('switchText').textContent = signup ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('switchBtn').textContent = signup ? 'Log in' : 'Sign up';
  };

  document.getElementById('authForm').onsubmit = async (e) => {
    e.preventDefault();
    let email = document.getElementById('email').value.trim();
    let pass = document.getElementById('password').value;
    let username = document.getElementById('username').value.trim().toLowerCase();
    let name = document.getElementById('fullName').value.trim();

    try {
      if (signup) {
        let res = await createUserWithEmailAndPassword(auth, email, pass);
        await set(ref(db, 'users/' + res.user.uid), {
          id: res.user.uid,
          name: name,
          username: username,
          email: email,
          pic: '',
          following: []
        });
        toast('Account Created!');
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
        toast('Logged In!');
      }
    } catch (err) {
      toast(err.message.replace('Firebase: ', ''));
    }
  };

  window.logout = () => signOut(auth);

  // Feed & Posts
  function renderFeed() {
    let f = document.getElementById('feed');
    let posts = Object.keys(dbPosts).map(k => ({id: k, ...dbPosts[k]})).sort((a,b) => b.time - a.time);
    f.innerHTML = posts.map(post => {
      let u = dbUsers[post.userId] || {};
      let liked = (post.likes || []).includes(currentUid);
      let isSaved = (post.saved || []).includes(currentUid);
      let commentsCount = Object.keys(post.comments || {}).length;

      return `<article class="post">
        <div class="post-head">
          <div class="person" onclick="openUser('${post.userId}')">
            <div class="small-avatar" ${avatarStyle(u.pic)}></div>
            <b>${esc(u.username || 'user')}</b>
          </div>
        </div>
        <div class="post-media">
          ${post.type === 'video' ? `<video src="${post.data}" controls></video>` : `<img src="${post.data}">`}
        </div>
        <div class="actions">
          <div class="actions-left">
            <button class="action ${liked?'liked':''}" onclick="likePost('${post.id}')">${liked?'♥':'♡'}</button>
            <button class="action" onclick="openComments('${post.id}')">💬</button>
            ${post.userId === currentUid ? `<button class="delete-btn" onclick="deletePost('${post.id}')" title="Delete Post">🗑️</button>` : ''}
          </div>
          <button class="action" onclick="savePost('${post.id}')">${isSaved?'🔖':'📑'}</button>
        </div>
        <div class="details">
          <div class="likes">${(post.likes||[]).length} likes</div>
          <div class="caption"><b>${esc(u.username||'user')}</b> ${esc(post.caption||'')}</div>
          <div class="comment-link" onclick="openComments('${post.id}')">
            ${commentsCount > 0 ? `View all ${commentsCount} comments` : 'Add a comment...'}
          </div>
        </div>
      </article>`;
    }).join('') || '<div style="padding:40px;text-align:center;color:#777">No posts available</div>';
  }

  window.likePost = (postId) => {
    let p = dbPosts[postId];
    if(!p) return;
    let likes = p.likes || [];
    let idx = likes.indexOf(currentUid);
    if(idx >= 0) likes.splice(idx, 1);
    else likes.push(currentUid);
    set(ref(db, `posts/${postId}/likes`), likes);
  };

  window.savePost = (postId) => {
    let p = dbPosts[postId];
    if(!p) return;
    let saved = p.saved || [];
    let idx = saved.indexOf(currentUid);
    if(idx >= 0) saved.splice(idx, 1);
    else saved.push(currentUid);
    set(ref(db, `posts/${postId}/saved`), saved);
  };

  window.deletePost = (postId) => {
    if (confirm('Are you sure you want to delete this post?')) {
      remove(ref(db, `posts/${postId}`));
      toast('Post deleted');
    }
  };

  // Uploading
  window.openUpload = () => { window.showTab('upload'); selectedFile = null; };

  document.getElementById('fileInput').onchange = e => {
    let f = e.target.files[0];
    if(!f) return;
    selectedFile = f;
    let r = new FileReader();
    r.onload = () => {
      previewUrl = r.result;
      previewType = f.type.startsWith('video') ? 'video' : 'image';
      document.getElementById('preview').innerHTML = previewType === 'video' ? `<video src="${previewUrl}" controls></video>` : `<img src="${previewUrl}">`;
    };
    r.readAsDataURL(f);
  };

  window.publish = () => {
    if(!previewUrl) return toast('Select a file first');
    let newPostRef = push(ref(db, 'posts'));
    set(newPostRef, {
      userId: currentUid,
      data: previewUrl,
      type: previewType,
      caption: document.getElementById('caption').value,
      time: Date.now(),
      likes: [],
      saved: []
    });
    document.getElementById('caption').value = '';
    document.getElementById('preview').textContent = 'Select a photo or video';
    previewUrl = '';
    window.showTab('home');
    toast('Post published live!');
  };

  // Stories
  function renderStories() {
    let box = document.getElementById('stories');
    if(!box) return;
    let html = `<div class="story" onclick="document.getElementById('storyFileInput').click()">
      <div class="ring add-story-ring"><div class="avatar">+</div></div>
      <div style="margin-top:4px">Your story</div>
    </div>`;

    Object.keys(dbStories).forEach(k => {
      let s = dbStories[k];
      let u = dbUsers[s.userId] || {};
      html += `<div class="story" onclick="viewStory('${k}')">
        <div class="ring"><div class="avatar" ${avatarStyle(u.pic)}></div></div>
        <div style="margin-top:4px">${esc(u.username || 'user')}</div>
      </div>`;
    });
    box.innerHTML = html;
  }

  window.handleStoryUpload = (e) => {
    let f = e.target.files[0];
    if(!f) return;
    let r = new FileReader();
    r.onload = () => {
      push(ref(db, 'stories'), {
        userId: currentUid,
        data: r.result,
        time: Date.now()
      });
      toast('Story uploaded!');
    };
    r.readAsDataURL(f);
  };

  window.viewStory = (storyId) => {
    let s = dbStories[storyId];
    if(!s) return;
    let u = dbUsers[s.userId] || {};
    document.getElementById('storyUser').textContent = u.username || 'Story';
    document.getElementById('storyBody').innerHTML = `<img src="${s.data}" style="width:100%;max-height:60vh;object-fit:contain">`;
    document.getElementById('storyModal').classList.remove('hidden');
  };

  window.closeStory = () => {
    document.getElementById('storyModal').classList.add('hidden');
  };

  // Reels
  function renderReels() {
    let box = document.getElementById('reelsList');
    if(!box) return;
    let reels = Object.keys(dbPosts).filter(k => dbPosts[k].type === 'video').map(k => ({id: k, ...dbPosts[k]}));
    box.innerHTML = reels.map(r => {
      let u = dbUsers[r.userId] || {};
      return `<div class="reel">
        <video src="${r.data}" loop onclick="this.paused ? this.play() : this.pause()"></video>
        <div class="reel-info">
          <b>@${esc(u.username||'user')}</b>
          <p style="margin-top:4px">${esc(r.caption||'')}</p>
        </div>
        <div class="reel-actions">
          <button class="action" onclick="likePost('${r.id}')">♥</button>
          <button class="action" onclick="openComments('${r.id}')">💬</button>
        </div>
      </div>`;
    }).join('') || '<div style="padding:40px;text-align:center;color:#777">No video reels available</div>';
  }

  // Comments
  window.openComments = (postId) => {
    activeCommentPostId = postId;
    renderCommentsList();
    document.getElementById('commentModal').classList.remove('hidden');
  };

  window.closeComments = () => {
    document.getElementById('commentModal').classList.add('hidden');
    activeCommentPostId = null;
  };

  function renderCommentsList() {
    let p = dbPosts[activeCommentPostId];
    if(!p) return;
    let comments = p.comments || {};
    let box = document.getElementById('commentsList');
    box.innerHTML = Object.keys(comments).map(k => {
      let c = comments[k];
      let u = dbUsers[c.userId] || {};
      return `<div class="comment-item">
        <div class="small-avatar" style="width:24px;height:24px;${u.pic?`background-image:url('${u.pic}')`:''}"></div>
        <div><b>${esc(u.username||'user')}:</b> ${esc(c.text)}</div>
      </div>`;
    }).join('') || '<p style="color:#777;text-align:center">No comments yet.</p>';
  }

  window.submitComment = () => {
    let inp = document.getElementById('commentInput');
    let txt = inp.value.trim();
    if(!txt || !activeCommentPostId) return;
    push(ref(db, `posts/${activeCommentPostId}/comments`), {
      userId: currentUid,
      text: txt,
      time: Date.now()
    });
    inp.value = '';
    renderCommentsList();
  };

  // Search
  window.searchUsers = (query) => {
    let q = query.toLowerCase().trim();
    let box = document.getElementById('searchResults');
    if(!q) { box.innerHTML = ''; return; }
    let matches = Object.keys(dbUsers)
      .filter(id => id !== currentUid && ((dbUsers[id].username||'').includes(q) || (dbUsers[id].name||'').toLowerCase().includes(q)))
      .map(id => dbUsers[id]);
    box.innerHTML = matches.map(u => `
      <div class="search-result" onclick="openUser('${u.id}')">
        <div class="small-avatar" ${avatarStyle(u.pic)}></div>
        <div><b>${esc(u.username)}</b><div style="color:#888;font-size:12px">${esc(u.name)}</div></div>
      </div>
    `).join('') || '<div style="padding:15px;color:#777">No users found</div>';
  };

  // Profile & Nav Functions
  window.showTab = (id) => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.bottom button').forEach(b => b.classList.remove('active-nav'));
    let navBtn = document.getElementById('nav-' + id);
    if(navBtn) navBtn.classList.add('active-nav');
  };

  window.switchProfileTab = (tab) => {
    profileTab = tab;
    document.getElementById('btnMyPosts').classList.toggle('active', tab === 'posts');
    document.getElementById('btnSavedPosts').classList.toggle('active', tab === 'saved');
    renderProfile();
  };

  function renderProfile() {
    let myObj = dbUsers[currentUid] || {};
    document.getElementById('myAvatar').style.backgroundImage = myObj.pic ? `url('${myObj.pic}')` : '';
    document.getElementById('myName').textContent = myObj.name || '';
    let myPosts = Object.keys(dbPosts).filter(k => dbPosts[k].userId === currentUid);
    document.getElementById('postCount').textContent = myPosts.length;
    document.getElementById('followerCount').textContent = Object.keys(dbUsers).filter(k => (dbUsers[k].following||[]).includes(currentUid)).length;
    document.getElementById('followingCount').textContent = (myObj.following || []).length;
    
    let gridPosts = profileTab === 'posts' ? myPosts : Object.keys(dbPosts).filter(k => (dbPosts[k].saved||[]).includes(currentUid));
    document.getElementById('myGrid').innerHTML = gridPosts.map(k => {
      let p = dbPosts[k];
      return `<div class="grid-item">${p.type==='video'?`<video src="${p.data}"></video>`:`<img src="${p.data}">`}</div>`;
    }).join('') || '<div style="grid-column:1/-1;padding:30px;text-align:center;color:#777">No posts</div>';
  }

  window.changeProfilePic = () => document.getElementById('profileInput').click();
  window.saveProfilePic = (e) => {
    let f = e.target.files[0];
    if(!f) return;
    let r = new FileReader();
    r.onload = () => {
      update(ref(db, `users/${currentUid}`), { pic: r.result });
      toast('Profile photo updated!');
    };
    r.readAsDataURL(f);
  };

  window.openUser = (userId) => {
    if(userId === currentUid) return window.showTab('profile');
    profileUser = userId;
    let u = dbUsers[userId] || {};
    let myObj = dbUsers[currentUid] || {};
    document.getElementById('personAvatar').style.backgroundImage = u.pic ? `url('${u.pic}')` : '';
    document.getElementById('personName').textContent = u.name || 'User';
    document.getElementById('personUsername').textContent = '@' + (u.username || 'user');
    
    let isFollowing = (myObj.following || []).includes(userId);
    let btn = document.getElementById('personFollowBtn');
    btn.textContent = isFollowing ? 'Unfollow' : 'Follow';
    btn.className = isFollowing ? 'secondary' : 'primary';

    let followersCount = Object.keys(dbUsers).filter(k => (dbUsers[k].following || []).includes(userId)).length;
    document.getElementById('personFollowerCount').textContent = followersCount;
    document.getElementById('personFollowingCount').textContent = (u.following || []).length;

    let userPosts = Object.keys(dbPosts).filter(k => dbPosts[k].userId === userId);
    document.getElementById('personGrid').innerHTML = userPosts.map(k => {
      let p = dbPosts[k];
      return `<div class="grid-item">${p.type === 'video' ? `<video src="${p.data}"></video>` : `<img src="${p.data}">`}</div>`;
    }).join('') || '<div style="grid-column:1/-1;padding:30px;text-align:center;color:#777">No posts</div>';

    window.showTab('personProfile');
  };

  window.toggleFollowPerson = () => {
    if(!profileUser) return;
    let myObj = dbUsers[currentUid] || {};
    let following = myObj.following || [];
    let idx = following.indexOf(profileUser);
    if(idx >= 0) following.splice(idx, 1);
    else following.push(profileUser);
    update(ref(db, `users/${currentUid}`), { following });
    openUser(profileUser);
  };

  window.startProfileChat = () => {
    if(profileUser) window.openChatWith(profileUser);
  };

  // Realtime Chat
  window.openChatList = () => { window.showTab('chat'); window.backChats(); };
  window.backChats = () => {
    document.getElementById('chatListView').classList.remove('hidden');
    document.getElementById('chatRoom').classList.add('hidden');
    activeChat = null;
  };

  function renderChats() {
    let box = document.getElementById('chatList');
    let users = Object.keys(dbUsers).filter(k => k !== currentUid).map(k => dbUsers[k]);
    box.innerHTML = users.map(u => `<div class="chat-row" onclick="openChatWith('${u.id}')">
      <div class="small-avatar" ${avatarStyle(u.pic)}></div>
      <div><b>${esc(u.username)}</b><div style="color:#888;font-size:12px">${esc(u.name)}</div></div>
    </div>`).join('') || '<div style="padding:20px;text-align:center;color:#777">No users found</div>';
  }

  window.openChatWith = (userId) => {
    window.showTab('chat');
    activeChat = userId;
    let u = dbUsers[userId] || {};
    document.getElementById('chatTitle').textContent = u.username || 'Chat';
    document.getElementById('chatListView').classList.add('hidden');
    document.getElementById('chatRoom').classList.remove('hidden');
    renderMessages();
  };

  function renderMessages() {
    if(!activeChat) return;
    let chatKey = [currentUid, activeChat].sort().join('_');
    let msgs = dbChats[chatKey] || {};
    let box = document.getElementById('messages');
    box.innerHTML = Object.keys(msgs).map(k => {
      let m = msgs[k];
      return `<div class="bubble ${m.from === currentUid ? 'sent' : 'received'}">${esc(m.text)}</div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }

  window.sendMessage = () => {
    let inp = document.getElementById('messageInput');
    let txt = inp.value.trim();
    if(!txt || !activeChat) return;
    let chatKey = [currentUid, activeChat].sort().join('_');
    push(ref(db, `chats/${chatKey}`), {
      from: currentUid,
      text: txt,
      time: Date.now()
    });
    inp.value = '';
  };

  // VIDEO CALL FEATURE (WebRTC + Firebase Signaling)
  window.startVideoCall = async () => {
    if(!activeChat) return toast('Select a chat to call');
    document.getElementById('videoModal').classList.remove('hidden');
    isCamOn = true;
    isMicOn = true;
    updateCallButtons();

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('localVideo').srcObject = localStream;
      
      peerConnection = new RTCPeerConnection(rtcServers);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = event => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      toast('Starting video call...');
    } catch (err) {
      toast('Camera/Microphone access denied');
      window.endCall();
    }
  };

  window.toggleCamera = () => {
    if (!localStream) return;
    let videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      isCamOn = !isCamOn;
      videoTrack.enabled = isCamOn;
      updateCallButtons();
      toast(isCamOn ? 'Camera Turned On' : 'Camera Off');
    }
  };

  window.toggleMic = () => {
    if (!localStream) return;
    let audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      isMicOn = !isMicOn;
      audioTrack.enabled = isMicOn;
      updateCallButtons();
      toast(isMicOn ? 'Microphone On' : 'Muted');
    }
  };

  function updateCallButtons() {
    let camBtn = document.getElementById('btnToggleCam');
    let micBtn = document.getElementById('btnToggleMic');
    
    camBtn.textContent = isCamOn ? '📹' : '📷🚫';
    camBtn.classList.toggle('off', !isCamOn);

    micBtn.textContent = isMicOn ? '🎙️' : '🎙️🚫';
    micBtn.classList.toggle('off', !isMicOn);
  }

  window.endCall = () => {
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    if (peerConnection) {
      peerConnection.close();
      peerConnection = null;
    }
    document.getElementById('videoModal').classList.add('hidden');
    toast('Call ended');
  };
</script>
</body>
</html>
