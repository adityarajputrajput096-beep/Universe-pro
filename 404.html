<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Universe Pro - Page Not Found</title>
    
    <!-- Preconnect for Performance Optimization -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #030303;
            --surface-card: #0d0d0d;
            --border-subtle: #222222;
            --accent-glow: #0095f6;
            --text-primary: #ffffff;
            --text-secondary: #8e8e8e;
            --danger: #ed4956;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .error-container {
            width: 100%;
            max-width: 420px;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); scale: 0.98; }
            to { opacity: 1; transform: translateY(0); scale: 1; }
        }

        .app-brand {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .error-icon-box {
            width: 72px;
            height: 72px;
            background: rgba(237, 73, 86, 0.1);
            border: 1px solid rgba(237, 73, 86, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--danger);
            font-size: 28px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .action-btn {
            width: 100%;
            background: var(--accent-glow);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 20px rgba(0, 149, 246, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .status-indicator {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="app-brand">Universe Pro Engine</div>
        
        <div class="error-icon-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h1>पेج नहीं मिला (404)</h1>
        <p>आप जिस यूआरएल या रिसोर्स को ढूंढ रहे हैं, वह या तो हटा दिया गया है या उसका पता बदल गया है। सिस्टम आपको सुरक्षित रूप से होमपेज पर रीडायरेक्ट कर रहा है।</p>

        <a href="index.html" class="action-btn">
            <i class="fa-solid fa-house"></i> होमपेज पर जाएं
        </a>

        <div class="status-indicator">
            <span class="dot"></span> सिस्टम सुरक्षित और एक्टिव है
        </div>
    </div>

    <script>
        // Enterprise Grade Error Guard & Safe Auto-Redirect
        (function() {
            'use strict';
            try {
                // Check if session storage or history can be safely handled
                window.history.replaceState({}, document.title, window.location.pathname);
                
                // Fast & Clean Auto-Redirect to prevent UI lock
                setTimeout(function() {
                    window.location.replace('index.html');
                }, 3500);
            } catch (err) {
                console.error("Universe Pro Recovery Engine Triggered: ", err);
                window.location.href = 'index.html';
            }
        })();
    </script>
</body>
</html>
